method: ours
seed: 7
output_dir: outputs
data:
  name: popqa
  hf_name: akariasai/PopQA
  hf_config: null
  split: test
  subset_size: 500
  subset_seed: 42
  subset_strategy: random
  batch_size: 10
  num_batches: 250
main_llm:
  provider: groq
  model_name: llama-3.3-70b-versatile
  temperature: 0.0
  max_output_tokens: 128
  request_timeout: 120
  retry_attempts: 8
  retry_sleep: 2.0
  min_seconds_between_calls: 2.5
score_model:
  provider: minilm
  model_name: sentence-transformers/all-MiniLM-L6-v2
  max_length: 512
  encode_batch_size: 64
  pooling: mean
  torch_dtype: auto
  device: auto
  normalize_features: true
  cache_dir: null
policy:
  epsilon: 0.175
  alpha_step_size: 0.1
  theta_step_size: 0.1
  initial_alpha: 0.0
  theta_init_scale: 0.01
  warm_start_batches: 0
  budget_per_batch: 5
  cost_variant: constant
  l2_reg: 0.0
