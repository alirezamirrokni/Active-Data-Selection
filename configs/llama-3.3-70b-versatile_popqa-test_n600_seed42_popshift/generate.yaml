output_dir: outputs
data:
  name: popqa
  hf_name: akariasai/PopQA
  hf_config: null
  split: test
  subset_size: 600
  subset_seed: 42
  subset_strategy: popularity_balanced
  dataset_tag: popshift
  batch_size: 10
  num_batches: 180
  sample_seed: 42
  shift_stream:
    enabled: true
    description: 'Sequential PopQA popularity shift: head entities -> mid-popularity
      entities -> long-tail entities.'
    phases:
    - name: Head
      num_batches: 60
      filter:
        popularity_quantile:
        - 0.667
        - 1.0
    - name: Middle
      num_batches: 60
      filter:
        popularity_quantile:
        - 0.333
        - 0.667
    - name: Long-tail
      num_batches: 60
      filter:
        popularity_quantile:
        - 0.0
        - 0.333
  max_samples: 600
main_llm:
  provider: groq
  model_name: llama-3.3-70b-versatile
  temperature: 0.0
  max_output_tokens: 128
  request_timeout: 120
  retry_attempts: 8
  retry_sleep: 2.0
  min_seconds_between_calls: 2.5
