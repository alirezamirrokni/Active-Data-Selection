method: ours_llm
seed: 7
output_dir: outputs

data:
  name: math500
  hf_name: HuggingFaceH4/MATH-500
  split: test
  batch_size: 10
  num_batches: 250

main_llm:
  provider: groq
  model_name: llama-3.3-70b-versatile
  temperature: 0.0
  max_output_tokens: 1024
  request_timeout: 120
  retry_attempts: 8
  retry_sleep: 2.0
  min_seconds_between_calls: 2.5
  prompt_version: math500_answer_format_mathverify_v1

selector_llm:
  provider: groq
  model_name: llama-3.3-70b-versatile
  temperature: 0.0
  max_output_tokens: 64
  request_timeout: 120
  retry_attempts: 8
  retry_sleep: 2.0
  min_seconds_between_calls: 2.5
  system_prompt: |
    You are an expert evaluator of model-generated math answers.
    Your task is to estimate whether a human evaluator would need to modify the model answer.
    Return only valid JSON. Do not include explanations, markdown, or extra text.

policy:
  epsilon: 0.445
  alpha_step_size: 0.1
  initial_alpha: 0.0
  warm_start_batches: 0
  budget_per_batch: 5
  cost_variant: constant
  fallback_score: 0.5
  max_question_chars: 2500
  max_answer_chars: 2500
  score_prompt: |
    Estimate the posterior edit probability for this prompt-response pair.

    Definition:
    - score = probability in [0, 1] that a human evaluator would modify the model answer.
    - High score means the answer likely contains a mathematical error, unsupported conclusion, missing final answer, ambiguity, or format problem.
    - Low score means the answer is likely correct and would be confirmed without modification.

    Rules:
    - Use only the problem and the model answer below.
    - Do not assume access to the gold answer.
    - Return only valid JSON in exactly this format:
      {{"score": 0.73}}

    Problem:
    {question}

    Model answer:
    {model_answer}
