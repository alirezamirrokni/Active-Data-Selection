method: random
seed: 7
output_dir: outputs
data:
  name: popqa
  hf_name: akariasai/PopQA
  hf_config: null
  split: test
  subset_size: 500
  subset_seed: 42
  subset_strategy: random
  batch_size: 10
  num_batches: 250
main_llm:
