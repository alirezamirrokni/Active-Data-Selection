output_dir: outputs

data:
  name: triviaqa500
  hf_name: mandarjoshi/trivia_qa
  hf_config: rc.nocontext
  split: validation
  subset_size: 500
  subset_seed: 42
  max_samples: 500

main_llm:
  provider: groq
  model_name: llama-3.3-70b-versatile
  temperature: 0.0
  max_output_tokens: 128
  request_timeout: 120
  retry_attempts: 8
  retry_sleep: 2.0
  min_seconds_between_calls: 2.5
